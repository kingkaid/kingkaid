[package]
name = "kingkaid"
version = "1.0.0"
description = "KingKaid — Short-video AI toolbox"
authors = ["KingKaid"]
edition = "2021"

[lib]
name = "kingkaid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
portpicker = "0.1"
